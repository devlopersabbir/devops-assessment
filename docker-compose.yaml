services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-assessment-api
    restart: unless-stoped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      APP_ENV: "production"
      APP_VERSION: "1.0.0"

    mem_limit: 128m
    cpus: 0.50

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8080/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
