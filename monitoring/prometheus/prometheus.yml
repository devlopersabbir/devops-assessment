global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: "devops-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["3.111.180.6:8080"]
        labels:
          environment: "production"
          service: "api"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: "production"
          instance: "host-node"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: "production"
          instance: "docker-engine"
