name: Main CI/CD Pipeline

# Branch -> environment mapping:
#   master          -> staging
#   main / v*.*.*   -> prod
on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  # 1. Run all CI validations.
  ci:
    name: CI Validation
    uses: ./.github/workflows/ci.yaml

  # 2. Build, scan and publish Docker image. (skip push on pull request)
  cd:
    name: Docker Build and Publish
    needs: ci
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/cd.yaml

  # 3. Deploy only after successful image publishing.
  deploy:
    name: Deploy to EC2
    needs: cd
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yaml

    # Pass the exact image produced by the CD workflow and the target environment.
    with:
      image_tag: ${{ fromJSON(toJSON(needs.cd.outputs)).image_tag }}
      environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'prod' || 'staging' }}

    # Pass the required deployment secrets.
    secrets: inherit

  # 4. Trigger Discord Notification on CD failure, Deploy failure, or Deploy success
  notify:
    name: Discord Notification
    needs:
      - cd
      - deploy
    if: always() && github.event_name != 'pull_request' && (needs.cd.result == 'failure' || needs.deploy.result == 'failure' || needs.deploy.result == 'success')
    uses: ./.github/workflows/notify.yaml
    with:
      status: ${{ needs.deploy.result == 'success' && 'success' || 'failure' }}
      stage: ${{ needs.cd.result == 'failure' && 'CD (Docker Build & Publish)' || 'Deploy to EC2' }}
      image_tag: ${{ fromJSON(toJSON(needs.cd.outputs)).image_tag }}
    secrets: inherit
