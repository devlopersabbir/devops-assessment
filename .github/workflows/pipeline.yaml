name: Main CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  # Run all CI validations.
  ci:
    name: CI Validation
    uses: ./.github/workflows/ci.yaml

  # Build, scan and publish Docker image. (skip push on pull request)
  cd:
    name: Docker Build and Publish
    needs: ci
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/cd.yaml
    secrets: inherit

  # Deploy only after successful image publishing.
  deploy:
    name: Deploy to EC2
    needs: cd
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yaml

    # Pass the exact image produced by the CD workflow.
    with:
      image_tag: ${{ needs.cd.outputs.image_tag }}

    # Pass the required deployment secrets.
    secrets: inherit
