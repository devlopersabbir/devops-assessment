name: Notify - Discord

on:
  workflow_call:
    inputs:
      status:
        description: "Notification status (success or failure)"
        required: true
        type: string
      stage:
        description: "Name of the stage (e.g., CD (Docker Build & Publish) or Deploy to EC2)"
        required: true
        type: string
      image_tag:
        description: "Deployed Docker image tag"
        required: false
        type: string
        default: "N/A"

  workflow_dispatch:
    inputs:
      status:
        description: "Notification status (success or failure)"
        required: false
        type: string
        default: "success"
      stage:
        description: "Name of the stage"
        required: false
        type: string
        default: "Deploy to EC2"
      image_tag:
        description: "Deployed Docker image tag"
        required: false
        type: string
        default: "manual-run"

permissions:
  contents: read

jobs:
  discord-notify:
    name: Discord Notification
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord on Deployment Success
        if: inputs.status == 'success'
        uses: devlopersabbir/action-notifier@v1.2.0
        with:
          provider: discord
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          message: |
            **✅ ${{ inputs.stage }} Succeeded!**
            Repository: `${{ github.repository }}`
            Image: `${{ inputs.image_tag }}`
            Commit: `${{ github.sha }}`

      - name: Notify Discord on Failure
        if: inputs.status != 'success'
        uses: devlopersabbir/action-notifier@v1.2.0
        with:
          provider: discord
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          message: |
            **🚨 ${{ inputs.stage }} Failed!**
            Repository: `${{ github.repository }}`
            Commit: `${{ github.sha }}`
            Please inspect the workflow logs immediately.
