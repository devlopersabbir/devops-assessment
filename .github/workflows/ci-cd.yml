name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: app
  CONTAINER_NAME: devops-assessment-api
  APP_PORT: "8080"

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: read

jobs:
  # Pull Request & Repository Validation
  pr-validation:
    name: Pull Request Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR metadata and branch hygiene
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Validating Pull Request: ${PR_TITLE}"
          if [ -z "${PR_TITLE}" ] || [ "${#PR_TITLE}" -lt 3 ]; then
            echo "::error::Pull request title must be at least 3 characters long."
            exit 1
          fi

      - name: Check for unresolved merge conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':(exclude).github/workflows/*'; then
            echo "::error::Unresolved merge conflict markers found."
            exit 1
          fi

      - name: Validate VERSION file
        run: |
          if [ ! -s "${APP_DIR}/VERSION" ]; then
            echo "::error::${APP_DIR}/VERSION is missing or empty."
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < "${APP_DIR}/VERSION")
          echo "Detected application version: ${VERSION}"
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semantic version '${VERSION}' in ${APP_DIR}/VERSION"
            exit 1
          fi
