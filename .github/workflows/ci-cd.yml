name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: app
  CONTAINER_NAME: devops-assessment-api
  APP_PORT: "8080"

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: read

jobs:
  # Pull Request & Repository Validation
  pr-validation:
    name: Pull Request Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR metadata and branch hygiene
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Validating Pull Request: ${PR_TITLE}"
          if [ -z "${PR_TITLE}" ] || [ "${#PR_TITLE}" -lt 3 ]; then
            echo "::error::Pull request title must be at least 3 characters long."
            exit 1
          fi

      - name: Check for unresolved merge conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':(exclude).github/workflows/*'; then
            echo "::error::Unresolved merge conflict markers found."
            exit 1
          fi

      - name: Validate VERSION file
        run: |
          if [ ! -s "${APP_DIR}/VERSION" ]; then
            echo "::error::${APP_DIR}/VERSION is missing or empty."
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < "${APP_DIR}/VERSION")
          echo "Detected application version: ${VERSION}"
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semantic version '${VERSION}' in ${APP_DIR}/VERSION"
            exit 1
          fi

  # Go Linting & Unit Tests
  go-lint-test:
    name: Go Lint, Unit Tests & Secret Detection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.APP_DIR }}/go.mod
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum

      - name: Verify Go dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check Go formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "::error::The following Go files are not properly formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ env.APP_DIR }}

      - name: Run unit tests with race detector & coverage
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-report
          path: ${{ env.APP_DIR }}/coverage.out
          retention-days: 3

  # Dockerfile Linting with Hadolint
  hadolint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3018

  # ShellCheck Linting
  shellcheck:
    name: Shell Script Lint (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ShellCheck on all shell scripts
        run: |
          mapfile -t SCRIPTS < <(find . -type f -name "*.sh" -not -path "./.git/*")
          if [ "${#SCRIPTS[@]}" -eq 0 ]; then
            echo "No .sh scripts found to lint; skipping ShellCheck."
            exit 0
          fi
          echo "Linting ${#SCRIPTS[@]} shell script(s): ${SCRIPTS[*]}"
          shellcheck --severity=warning "${SCRIPTS[@]}"

  # Trivy Filesystem & Configuration Vulnerability Scanning
  trivy-fs-scan:
    name: Trivy Vulnerability Scan (Filesystem & Config)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem and misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # 6 & 7. Multi-Architecture Docker Build, Image Scan & GHCR Publishing
  build-and-push:
    name: Multi-Arch Docker Build & GHCR Publish
    runs-on: ubuntu-latest
    needs:
      - pr-validation
      - go-lint-test
      - hadolint
      - shellcheck
      - trivy-fs-scan
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read application version and compute image tags
        id: vars
        run: |
          IMAGE_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          VERSION=$(tr -d '[:space:]' < "${APP_DIR}/VERSION")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "image_repo=${REGISTRY}/${IMAGE_LOWER}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${REGISTRY}/${IMAGE_LOWER}:${VERSION}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image_repo }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.version }}-${{ github.sha }},enable=false
            type=sha,prefix={{branch}}-
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build single-arch image for Trivy container scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
          tags: ${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan built Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-architecture Docker image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.vars.outputs.image_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
